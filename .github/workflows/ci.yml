name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dev dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Inventory up to date
        run: npm run inventory:check

      # Foundry 14.371 bundles PDF.js 6.5.438; the pin stays on the verified build's 4.0.379.
      # On 6.x only, the bold test fails if the extractor stops passing fontExtraProperties.
      # 6.x's build calls Promise.try, which Node 22 lacks (Foundry's Chromium has it): Node 24 for this step.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: PDF suites on PDF.js 6.5.438
        run: |
          npm install --no-save pdfjs-dist@6.5.438
          node --test test/session-pdf.test.mjs test/pdf-extract-synth.test.mjs test/importer-read-whole-book.test.mjs
