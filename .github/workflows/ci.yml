name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pdfjs-dist 6.x (Foundry 14.371's pdf.js) uses Promise.try and Uint8Array#toHex, which
      # Node 22 and 24 lack; Node 26 is the LTS line Foundry 14.371's notes name.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install dev dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Inventory up to date
        run: npm run inventory:check

      # The pin follows the verified build (14.371, PDF.js 6.5.438). module.json still allows
      # 14.364-14.370, which bundle 4.0.379, so the PDF suites run on that version too.
      - name: PDF suites on PDF.js 4.0.379
        run: |
          npm install --no-save pdfjs-dist@4.0.379
          node --test test/session-pdf.test.mjs test/pdf-extract-synth.test.mjs test/importer-read-whole-book.test.mjs
