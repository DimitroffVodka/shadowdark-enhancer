name: Release

# Tag a commit `vX.Y.Z` and push it to publish a release with module.json +
# module.zip attached, matching the install/download URLs in module.json
# (releases/latest/download/…).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into module.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
          m.version = process.env.VERSION;
          fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
          EOF

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Pull the `## [VERSION]` section up to (not including) the next `## [`.
          awk -v v="## [$VERSION]" '
            index($0, v)==1 {f=1; next}
            /^## \[/ {f=0}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Fail loudly rather than shipping an empty-body release.
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No CHANGELOG.md section found for $VERSION"
            exit 1
          fi
          # GitHub rejects a release body over 125,000 characters. A section up to
          # 120,000 ships whole. A longer one ships its intro and `### Highlights`
          # block and a link to CHANGELOG.md, which is in the module zip and on the
          # tag. (`wc -m` counts bytes under a non-UTF-8 locale, which can only
          # make this switch to the short body earlier, never later.)
          if [ "$(wc -m < RELEASE_NOTES.md)" -gt 120000 ]; then
            echo "::notice::CHANGELOG.md section for $VERSION is over 120,000 characters; publishing the intro and Highlights only"
            awk '
              /^### / { hl = ($0 == "### Highlights"); seen = 1 }
              !seen || hl { print }
            ' RELEASE_NOTES.md > RELEASE_SHORT.md
            printf '\nThe full list of changes ships in CHANGELOG.md inside the module: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> RELEASE_SHORT.md
            mv RELEASE_SHORT.md RELEASE_NOTES.md
          fi

      - name: Build module.zip
        run: |
          # docs/ stays out of the zip on purpose — it holds internal audits,
          # working-state reports, and development artifacts. The one public
          # document, docs/API.md (linked from README), ships explicitly.
          zip -r module.zip \
            module.json \
            README.md LICENSE CHANGELOG.md CREDITS.md \
            docs/API.md \
            assets icons languages scripts styles templates \
            -x "scripts/**/*.test.mjs"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            module.json
            module.zip
