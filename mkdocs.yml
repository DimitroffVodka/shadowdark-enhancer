site_name: Shadowdark Enhancer Manual
site_description: User manual for the Shadowdark Enhancer Foundry VTT module.
site_url: https://dimitroffvodka.github.io/shadowdark-enhancer/
repo_name: DimitroffVodka/shadowdark-enhancer
repo_url: https://github.com/DimitroffVodka/shadowdark-enhancer
edit_uri: edit/master/docs/wiki/
docs_dir: docs/wiki
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Installation & Setup: Installation-and-Setup.md
  - At the table:
      - Crawl Strip & Crawl Bar: Crawl-Strip-and-Crawl-Bar.md
      - Movement Budgets: Movement-Budgets.md
      - Random Encounters: Random-Encounters.md
      - Loot & Treasure: Loot-and-Treasure.md
      - Merchant Shop: Merchant-Shop.md
      - Party XP: Party-XP.md
      - Downtime: Downtime.md
      - Renown: Renown.md
      - Pit Fighting: Pit-Fighting.md
      - Session Recap: Session-Recap.md
  - Building content:
      - Importer Hub: Importer-Hub.md
      - Class & Spell Importers: Class-and-Spell-Importers.md
      - Table Import & Shapes: Table-Import-and-Shapes.md
      - Monster Creator: Monster-Creator.md
      - Monster Spell Library: Monster-Spell-Library.md
      - Monster Level Guidelines: Monster-Level-Guidelines.md
      - Monster Token Art: Monster-Token-Art.md
      - Magic Item Forge: Magic-Item-Forge.md
      - Forge & Loot: Forge-and-Loot.md
  - Characters:
      - Character Builder: Character-Builder.md
      - Export to PDF: Export-to-PDF.md
      - Mounts & Boats: Mounts-and-Boats.md
  - Reference:
      - Settings Reference: Settings-Reference.md
      - Compendium Packs: Compendium-Packs.md
      - Troubleshooting: Troubleshooting.md
