    <path d="M400 330 V372 M400 334 H430" fill="none" stroke="#4B352B" stroke-width="2.6"/>
    <path d="M410 336 H430 V356 H410 Z" fill="#B97755" stroke-width="1.7"/>
    <path d="M414 352 Q420 340 426 352 Z" fill="#E5B861" stroke-width="1.2"/>

