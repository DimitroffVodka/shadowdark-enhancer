    </pattern>
    <pattern id="flagHatch" width="48" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0.5 H48 M0 20.5 H48 M16 0 V20 M40 20 V40" fill="none" stroke="#010206" stroke-width="0.8" opacity="0.2"/>
    </pattern>
