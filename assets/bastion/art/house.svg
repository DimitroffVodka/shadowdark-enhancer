    <path d="M82 140 H382 V320 H82 Z" fill="url(#shingleHatch)" stroke="none"/>
    <path d="M82 140 H382 V320 H82 Z" fill="none" stroke-width="2.8"/>
    <path d="M82 230 C157 228, 307 232, 382 230" fill="none" stroke-width="3.1"/>

